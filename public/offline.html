<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hackban: offline</title>
<style>
  :root { color-scheme: light dark; --bg: #fff; --fg: #172b4d; --sub: #626f86; --btn: #0c66e4; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1d2125; --fg: #b6c2cf; --sub: #8c9bab; --btn: #579dff; } }
  html, body { height: 100%; margin: 0; }
  body { display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--fg);
    font: 14px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-align: center; padding: 16px; }
  /* Keep the window draggable when the title bar is overlaid. */
  .bar { position: fixed; top: 0; left: 0; right: 0; height: env(titlebar-area-height, 0px); app-region: drag; -webkit-app-region: drag; }
  h1 { font-size: 20px; margin: 16px 0 6px; }
  p { color: var(--sub); margin: 0 0 16px; }
  button { background: var(--btn); color: #fff; border: 0; border-radius: 3px; height: 32px; padding: 0 12px; font: inherit; font-weight: 500; cursor: pointer; }
</style>
</head>
<body>
<div class="bar"></div>
<main>
  <svg width="48" height="48" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#ec3750"/><rect x="6" y="6" width="8.5" height="18" rx="2" fill="#fff"/><rect x="17.5" y="6" width="8.5" height="11" rx="2" fill="#fff"/></svg>
  <h1>You're offline</h1>
  <p>Hackban needs a connection to load your boards.</p>
  <button onclick="location.reload()">Try again</button>
</main>
<script>addEventListener("online", () => location.reload());</script>
</body>
</html>
